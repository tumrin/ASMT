[project]
name = "resistance-workspace"
version = "0.1.0"
description = "Workspace root for the resistance analysis pipeline and API."
requires-python = ">=3.12"

[tool.uv]
package = false
constraint-dependencies = [
    "fastapi>=0.143.3",
    "httpx2>=2.13.1",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
    "uvicorn>=0.54.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "resistance-analysis",
    "resistance-api",
    "ruff",
    "ty",
]

[tool.uv.sources]
resistance-analysis = { workspace = true }
resistance-api = { workspace = true }
resistance-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
