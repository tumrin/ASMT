[project]
name = "resistance"
version = "0.1.0"
description = "Cumulative-antibiogram analysis pipeline and API over the synthetic microbiology dataset."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "polars",
    "pydantic",
    "uvicorn",
]

[project.scripts]
resistance-analysis = "resistance.cli:analysis_main"
resistance-api = "resistance.cli:api_main"

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
