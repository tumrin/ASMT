[project]
name = "resistance-analysis"
version = "0.1.0"
description = "Cumulative-antibiogram analysis over the synthetic microbiology dataset; writes dataset.json."
requires-python = ">=3.12"
dependencies = [
    "polars",
    "resistance-core",
]

[project.scripts]
resistance-analysis = "resistance_analysis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
