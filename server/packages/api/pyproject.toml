[project]
name = "resistance-api"
version = "0.1.0"
description = "FastAPI serving layer over the analysis artifacts. Does not import the pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "polars",
    "pydantic",
    "resistance-core",
    "uvicorn",
]

[project.scripts]
resistance-api = "resistance_api.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
